name: Zygor-to-MD
description: Generate a deterministic Markdown project guide from a ZIP archive in GitHub Actions.
author: zygordev
branding:
  icon: file-text
  color: green
inputs:
  input:
    description: Path to a ZIP archive, or a directory to archive first.
    required: true
  output:
    description: Markdown output path.
    required: false
    default: project-overview.md
  style:
    description: field-notes, catalog, or compact.
    required: false
    default: field-notes
  template:
    description: Optional template using {{path}}, {{metadata}}, and {{content}}.
    required: false
  instruction:
    description: Deterministic local formatting instruction included in the document.
    required: false
  summary:
    description: Optional JSON scan report output path.
    required: false
  manifest:
    description: Optional machine-readable manifest JSON output path.
    required: false
  llms:
    description: Optional llms.txt output path for coding agents.
    required: false
  context-pack:
    description: Optional JSON context pack output path.
    required: false
  sarif:
    description: Optional SARIF security and policy output path.
    required: false
  html:
    description: Optional static HTML documentation output path.
    required: false
  mermaid:
    description: Optional Mermaid dependency graph output path.
    required: false
  exclude:
    description: Comma-separated glob patterns to omit, for example node_modules/**,.git/**,*.map.
    required: false
  max-files:
    description: Maximum files to scan after exclusions.
    required: false
    default: "2000"
  max-uncompressed-mb:
    description: Maximum uncompressed content to scan in megabytes.
    required: false
    default: "100"
  changed-only:
    description: For directory inputs, scan only files changed between HEAD^ and HEAD.
    required: false
    default: "false"
  fail-on-warning:
    description: Fail the action when the scanner emits warnings.
    required: false
    default: "false"
  fail-on-secret:
    description: Fail the action when a likely secret is detected.
    required: false
    default: "false"
  changed-report:
    description: Optional Markdown path for the Git diff name-status report.
    required: false
  pr-comment:
    description: Post the GitHub Step Summary as a pull request comment when enabled.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_INPUT: ${{ inputs.input }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_STYLE: ${{ inputs.style }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_INSTRUCTION: ${{ inputs.instruction }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_LLMS: ${{ inputs.llms }}
        INPUT_CONTEXT_PACK: ${{ inputs.context-pack }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_HTML: ${{ inputs.html }}
        INPUT_MERMAID: ${{ inputs.mermaid }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_MAX_UNCOMPRESSED_MB: ${{ inputs.max-uncompressed-mb }}
        INPUT_CHANGED_ONLY: ${{ inputs.changed-only }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_FAIL_ON_SECRET: ${{ inputs.fail-on-secret }}
        INPUT_CHANGED_REPORT: ${{ inputs.changed-report }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
      run: node "$GITHUB_ACTION_PATH/dist/action.mjs"
